<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="46%" r="54%">
      <stop offset="0%" stop-color="#123154" />
      <stop offset="55%" stop-color="#081022" />
      <stop offset="100%" stop-color="#05060f" />
    </radialGradient>
    <linearGradient id="frameGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#27e0ff" stop-opacity="0.85" />
      <stop offset="50%" stop-color="#4e7bff" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#ffd24a" stop-opacity="0.75" />
    </linearGradient>
    <linearGradient id="trailGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#27e0ff" stop-opacity="0" />
      <stop offset="45%" stop-color="#27e0ff" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.98" />
    </linearGradient>
    <radialGradient id="ballGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1" />
      <stop offset="45%" stop-color="#bff6ff" stop-opacity="0.95" />
      <stop offset="75%" stop-color="#27e0ff" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#27e0ff" stop-opacity="0" />
    </radialGradient>
    <filter id="neon" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Deep space rounded backdrop -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bgGlow)" />
  <rect
    x="22"
    y="22"
    width="468"
    height="468"
    rx="102"
    fill="none"
    stroke="url(#frameGrad)"
    stroke-width="10"
  />

  <!-- Subtle cyber grid lines -->
  <g stroke="#27e0ff" stroke-opacity="0.11" stroke-width="3">
    <line x1="60" y1="156" x2="452" y2="156" />
    <line x1="60" y1="256" x2="452" y2="256" />
    <line x1="60" y1="356" x2="452" y2="356" />
    <line x1="156" y1="60" x2="156" y2="452" />
    <line x1="256" y1="60" x2="256" y2="452" />
    <line x1="356" y1="60" x2="356" y2="452" />
  </g>

  <!-- Shattered neon crystal brick: upper-left half -->
  <g filter="url(#neon)">
    <polygon
      points="116,220 228,108 294,138 228,204 206,258 144,264"
      fill="#10395c"
      fill-opacity="0.72"
      stroke="#27e0ff"
      stroke-width="14"
      stroke-linejoin="round"
    />
    <!-- Lower-right shattered half -->
    <polygon
      points="284,218 352,188 396,248 278,366 218,332 252,270"
      fill="#1b264e"
      fill-opacity="0.72"
      stroke="#27e0ff"
      stroke-width="14"
      stroke-linejoin="round"
    />
  </g>

  <!-- Gold shatter sparks & fragments -->
  <g filter="url(#neon)">
    <polygon points="354,108 386,122 368,154 338,136" fill="#ffd24a" />
    <polygon points="122,308 146,298 154,324 128,334" fill="#27e0ff" />
    <polygon points="378,314 402,326 390,348 368,336" fill="#ffd24a" />
  </g>

  <!-- Diagonal energy ball streak -->
  <polygon points="134,370 156,392 326,222 292,188" fill="url(#trailGrad)" />

  <!-- Glowing energy ball -->
  <circle cx="312" cy="204" r="68" fill="url(#ballGlow)" filter="url(#softGlow)" />
  <circle cx="312" cy="204" r="34" fill="#ffffff" />
  <circle cx="312" cy="204" r="42" fill="none" stroke="#ffd24a" stroke-width="5" stroke-opacity="0.85" />

  <!-- Neon paddle at the bottom -->
  <rect
    x="156"
    y="404"
    width="200"
    height="26"
    rx="13"
    fill="#27e0ff"
    fill-opacity="0.35"
    filter="url(#softGlow)"
  />
  <rect x="164" y="408" width="184" height="18" rx="9" fill="#ffffff" stroke="#27e0ff" stroke-width="4" />
</svg>
